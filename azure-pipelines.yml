trigger:
- master
- dev

pool:
  name: SelfHostedPool

variables:
  buildConfiguration: 'Release'
  solution: 'ResilentAPI.sln'
  testResultsDirectory: '$(Build.SourcesDirectory)/TestResults'
  azureSubscription: 'Azure-Production'
  appName: 'WebResilentAPI-1'

stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: Build
    displayName: 'Build job'
    steps:

    - task: UseDotNet@2
      displayName: 'Install .NET SDK 8.x'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    # Restore
    - script: dotnet restore $(solution)
      displayName: 'Restore NuGet packages'

    # Build
    - script: dotnet build $(solution) --configuration $(buildConfiguration) --no-restore
      displayName: 'Build solution'

    
    - script: >
        dotnet test $(solution)
        --configuration $(buildConfiguration)
        --no-build
        --collect:"XPlat Code Coverage"
        --logger "trx;LogFileName=unit-tests-results.trx"
        --results-directory $(testResultsDirectory)
      displayName: 'Run unit tests and collect coverage'

    # Publish test results (works even if tests fail)
    - task: PublishTestResults@2
      displayName: 'Publish test results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '$(testResultsDirectory)/*/.trx'
        failTaskOnFailedTests: true
        publishRunAttachments: true

    # Publish code coverage results
    - task: PublishCodeCoverageResults@2
      displayName: 'Publish code coverage'
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: '$(testResultsDirectory)/**/coverage.cobertura.xml'
        codecoverageTool: 'Cobertura'
        reportDirectory: '$(testResultsDirectory)/**/Coverage'

    # Publish the application (only the web project)
    - script: dotnet publish ResilentAPI/ResilentAPI.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish
      displayName: 'Publish API project'

    # Upload artifacts for deployment stage
    - task: PublishBuildArtifacts@1
      displayName: 'Publish build artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  # Only deploy on master branch (and if build succeeded)
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - deployment: Deploy
    displayName: 'Deploy to App Service'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppLinux'
              appName: '$(appName)'
              package: '$(Pipeline.Workspace)/drop/publish/*.zip'   